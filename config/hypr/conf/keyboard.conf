input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules =
    kb_options = caps:swapescape
    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}
