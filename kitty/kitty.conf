include ./colors/colors.conf

# ─────────────────────────────────────────
# FONT
# ─────────────────────────────────────────
font_family      family='MonaspiceAr Nerd Font Mono' features='+calt +liga +ss07 +ss01 +ss02 +ss03 +ss04 +ss06 +ss09 +ss08'
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# ─────────────────────────────────────────
# BACKGROUND / EFFECTS
# ─────────────────────────────────────────
background_opacity    0.8
background_blur       1

# ─────────────────────────────────────────
# WINDOW SETTINGS
# ─────────────────────────────────────────
window_margin_width   5
window_padding_width  5
sync_to_monitor       no

# Cursor
cursor_shape block
cursor none
cursor_blink_interval 0
cursor_trail 2
cursor_trail_decay 0.1 0.15
cursor_trail_start_threshold 5
mouse_hide_wait -1
scrollbar never


shell .
editor .

wayland_titlebar_color system
