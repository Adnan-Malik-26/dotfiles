include ./colors/colors.conf

# ─────────────────────────────────────────
# FONT
# ─────────────────────────────────────────
font_family      EDSK Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_features    Eddysevka +calt +liga
font_size        15.0

# ─────────────────────────────────────────
# BACKGROUND / EFFECTS
# ─────────────────────────────────────────
background_opacity    0.4
background_blur       1

# ─────────────────────────────────────────
# WINDOW SETTINGS
# ─────────────────────────────────────────
window_margin_width   5
window_padding_width  5
sync_to_monitor       no

# Cursor
cursor_shape beam
shell_integration enabled
cursor none
cursor_blink_interval 0
cursor_trail 2
cursor_trail_decay 0.1 0.15
cursor_trail_start_threshold 5
mouse_hide_wait -1
scrollbar never
confirm_os_window_close 0



shell .
editor .

wayland_titlebar_color system
