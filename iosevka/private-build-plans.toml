[buildPlans.Eddysevka]
family = "Eddysevka"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

  [buildPlans.Eddysevka.variants]
  inherits = "ss14"

    [buildPlans.Eddysevka.variants.design]
    one = "base-long-top-serif"
    two = "curly-neck-serifed"
    three = "flat-top-serifed"
    four = "closed-serifed"
    five = "upright-flat-serifed"
    six = "straight-bar"
    seven = "straight-serifed"
    eight = "two-circles"
    nine = "straight-bar"
    zero = "tall-slashed"
    a = "double-storey-flat-bottom-serifed"
    g = "double-storey"
    l = "serifed-flat-tailed"
    m = "top-left-serifed"
    n = "straight-top-left-serifed"
    tilde = "low"
    asterisk = "hex-low"
    paren = "normal"
    brace = "straight"
    at = "fourfold"
    dollar = "through"
    percent = "rings-continuous-slash"
    decorative-angle-brackets = "tall"

[buildPlans.Eddysevka.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Eddysevka.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.Eddysevka.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.Eddysevka.widths.Extended]
shape = 600
menu = 7
css = "expanded"

[buildPlans.Eddysevka.widths.SemiExtended]
shape = 548
menu = 6
css = "semi-expanded"

[buildPlans.Eddysevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Eddysevka.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
