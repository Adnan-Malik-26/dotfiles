$mainMod = SUPER

# ========================================
# Application Launches
# ========================================
bind = $mainMod, Return, exec, ghostty
bind = $mainMod, Space, exec,  ~/.config/rofi/scripts/launcher_t7
bind = $mainMod, B, exec, firefox

# ========================================
# System & Utilities
# ========================================
bind = $mainMod ALT, L, exec, hyprlock
bind = $mainMod, Z, exec, hyprpicker -a
bind = $mainMod, N, exec, $HOME/.local/bin/wallpaperSwitcher
bind = $mainMod, U, exec, rofi-bluetooth -theme ~/.config/rofi/launchers/type-7/style-5.rasi
bind = $mainMod SHIFT, Q, exec, $HOME/.config/rofi/scripts/powermenu_t5
bind = $mainMod SHIFT, W, exec, $HOME/.local/bin/waybar-switcher

# ========================================
# Window Management
# ========================================
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, togglefloating

# ========================================
# Window Focus (Vim-style)
# ========================================
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r
bind = alt, space, exec, $(hyprctl activewindow -j | jq '.floating') && hyprctl dispatch cyclenext tiled || hyprctl dispatch cyclenext floating

# ========================================
# Move Windows (Vim-style)
# ========================================
bind = $mainMod CONTROL, H, movewindow, l
bind = $mainMod CONTROL, J, movewindow, d 
bind = $mainMod CONTROL, K, movewindow, u
bind = $mainMod CONTROL, L, movewindow, r

# ========================================
# Resize Windows (Vim-style)
# ========================================
bind = $mainMod SHIFT, h, resizeactive, -30 0
bind = $mainMod SHIFT, j, resizeactive, 0 30
bind = $mainMod SHIFT, k, resizeactive, 0 -30
bind = $mainMod SHIFT, l, resizeactive, 30 0

# ========================================
# Workspace Switching
# ========================================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ========================================
# Move Window to Workspace (Silent)
# ========================================
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# ========================================
# Mouse Bindings
# ========================================
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ========================================
# Screenshots
# ========================================
# Print Key
bind = ,print,exec, hyprshot -m window -o ~/Pictures/Screenshots/ 
bind = SHIFT,print,exec, hyprshot -m region -o ~/Pictures/Screenshots/ 
bind = $mainMod,print,exec, hyprshot -m output -o ~/Pictures/Screenshots/ 

# Insert Key (Alternative)
bind = ,INSERT,exec, hyprshot -m window -o ~/Pictures/Screenshots/ 
bind = SHIFT,INSERT,exec, hyprshot -m region -o ~/Pictures/Screenshots/ 
bind = $mainMod,INSERT,exec, hyprshot -m output -o ~/Pictures/Screenshots/ 

# ========================================
# Media Controls
# ========================================
# Volume
bind = ,XF86AudioMute, exec, $HOME/.local/bin/volume.sh --toggle
bind = ,XF86AudioRaiseVolume, exec, $HOME/.local/bin/volume.sh --inc
bind = ,XF86AudioLowerVolume, exec, $HOME/.local/bin/volume.sh --dec

# Brightness
bind = SHIFT ,F3, exec, $HOME/.local/bin/brightness.sh --inc
bind = SHIFT ,F2, exec, $HOME/.local/bin/brightness.sh --dec

# Music Playback
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ========================================
# Special Modes & Plugins
# ========================================
bind = ,F1, exec, $HOME/.local/bin/gaming-mode.sh
bind = $mainMod, P, exec, pypr toggle spotify
