#!/usr/bin/env bash
# ╭─────────────────────────────────────────────────────────────╮
# │                        TMUX CONFIG                          │
# ╰─────────────────────────────────────────────────────────────╯

# 🎨 TERMINAL & DISPLAY SETTINGS
set -a terminal-features "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set -g mouse on
setw -g mode-keys vi
set -g allow-passthrough on
set -g prefix C-Space
set -g detach-on-destroy off  # Don't exit tmux when closing a session
set -g base-index 1           # Start window numbering from 1
set -g pane-base-index 1      # Start pane numbering from 1
set -g renumber-windows on    # Renumber windows when one is closed
set -g mode-keys vi



BG_COLOR="#1A1D23" 
ACTIVE_COLOR="#ffffff" 
INACTIVE_COLOR="#4a4a4a" 
TEXT_COLOR="#ffffff" 
ACCENT_COLOR="#b4befe" 
TIM_ACTIVE="#a6e3a1" 
TIM_INACTIVE="#585b70"

# Status bar configuration
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g status-left-length 100
set -g status-right-length 100

set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=$ACTIVE_COLOR"

set -g message-style "bg=default,fg=$TEXT_COLOR,bold"
set -g message-command-style "bg=default,fg=$TEXT_COLOR,bold"

set -g window-status-format "#[fg=$INACTIVE_COLOR,bg=default] #I:#W "
set -g window-status-current-format "#[fg=$ACTIVE_COLOR,bg=default,bold] #I:#W "
set -g window-status-separator ""

set -g status-right '#(timew | awk "/^ *Total/ {print \$NF}") #[bg=green,fg=black,bold]#(timew | awk "/^ *Tracking/ {print \" \" \$NF \" \"}")#[bg=default] #[fg=brightblack] #{?client_prefix,#[fg=#cdd6f4](■‿■⌐),#[fg=grey](•‿• )}'
set -g status-left ' > #[fg=$ACTIVE_COLOR,bold]#S #[fg=$INACTIVE_COLOR]'

set -g mode-style "fg=${TEXT_COLOR} bg=${ACCENT_COLOR}"


bind-key v split-window -h -c "#{pane_current_path}"  # Vertical split
bind-key h split-window -v -c "#{pane_current_path}"  # Horizontal split
bind-key x kill-pane


bind-key o display-popup -E -w 50% -h 60% "~/.local/bin/new-session.sh"
bind-key "k" display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind-key "P" run-shell "open-pdf"

bind-key R new-session -s resume -c ~/Notes/Documents/Resume/ "nvim -c ':lua Snacks.picker.files()'"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"
bind t display-popup -E -w 100 -h 30 "dooit"
bind f popup -w 80% -h 80% -E

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vi-style copy-paste keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# 🧭 VIM-TMUX NAVIGATOR
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+
