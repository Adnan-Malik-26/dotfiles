#!/usr/bin/env bash
# ╭─────────────────────────────────────────────────────────────╮
# │                        TMUX CONFIG                          │
# ╰─────────────────────────────────────────────────────────────╯

# 🎨 TERMINAL & DISPLAY SETTINGS
set -a terminal-features "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set -g mouse on
setw -g mode-keys vi
set -g allow-passthrough on
set -g prefix C-Space
set -g detach-on-destroy off  # Don't exit tmux when closing a session
set -g base-index 1           # Start window numbering from 1
set -g pane-base-index 1      # Start pane numbering from 1
set -g renumber-windows on    # Renumber windows when one is closed
set -g mode-keys vi
set-option -g focus-events on

BG_COLOR="#1A1D23"
ACTIVE_COLOR="#ffffff"
INACTIVE_COLOR="#7a7a7a"
TEXT_COLOR="#ffffff"
ACCENT_COLOR="#ffffff"
TIM_ACTIVE="#a6e3a1"
TIM_INACTIVE="#585b70"

# Status bar configuration
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g status-left-length 100
set -g status-right-length 100

set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=$ACTIVE_COLOR"

set -g message-style "bg=default,fg=$TEXT_COLOR,bold"
set -g message-command-style "bg=default,fg=$TEXT_COLOR,bold"

set -g window-status-format "#[fg=#4a4a4a,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#c3dedd,bg=default,bold] #I:#W "
set -g window-status-separator ""


set -g status-right '#[fg=brightblack] #{?client_prefix,#[fg=#dac3dd](■‿■⌐),#[fg=#c3dedd](•‿• )}'
set -g status-left '#[fg=#c4d6c4] #[fg=#c4d6c4,bold]#S #[fg=#4a4a4a]'

set -g mode-style "fg=${TEXT_COLOR} bg=${ACCENT_COLOR}"


bind-key v split-window -h -c "#{pane_current_path}"  # Vertical split
bind-key h split-window -v -c "#{pane_current_path}"  # Horizontal split
bind-key x kill-pane

bind-key "f" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh

bind-key "k" display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind-key "b" display-popup -E "bluetuith"
bind-key "P" run-shell "open-pdf"

bind-key R new-session -s resume -c ~/Documents/Resume/ "nvim -c ':lua Snacks.picker.files()'"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"
bind t display-popup -E -w 100 -h 30 "nvim ~/.notes/My-Notes/Tasks.md"
bind "T" run "tmux new-window ~/.local/bin/time.sh"


bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vi-style copy-paste keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# 🧭 VIM-TMUX NAVIGATOR
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
