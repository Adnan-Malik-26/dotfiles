#!/usr/bin/env bash
# ╭─────────────────────────────────────────────────────────────╮
# │                        TMUX CONFIG                          │
# ╰─────────────────────────────────────────────────────────────╯

# ═══════════════════════════════════════════════════════════════
# 🎨 TERMINAL & DISPLAY SETTINGS
# ═══════════════════════════════════════════════════════════════

# Enable true color support
set -a terminal-features "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'

# Mouse support
set -g mouse on

# Enable passthrough for advanced terminal features
set -g allow-passthrough on

# ═══════════════════════════════════════════════════════════════
# ⌨️  PREFIX & CORE SETTINGS
# ═══════════════════════════════════════════════════════════════

# Set prefix to Ctrl+Space
set -g prefix C-Space

# Session behavior
set -g detach-on-destroy off  # Don't exit tmux when closing a session

# Window and pane indexing
set -g base-index 1           # Start window numbering from 1
set -g pane-base-index 1      # Start pane numbering from 1
set -g renumber-windows on    # Renumber windows when one is closed

# Vi mode keys
set -g mode-keys vi

# ═══════════════════════════════════════════════════════════════
# 🎨 STATUS LINE & VISUAL THEME
# ═══════════════════════════════════════════════════════════════

# Color palette (Catppuccin-inspired)
BG_COLOR="#1A1D23"
ACTIVE_COLOR="#b4befe"
INACTIVE_COLOR="#6c7086"
TEXT_COLOR="#cdd6f4"
ACCENT_COLOR="#b4befe"
TIM_ACTIVE="#a6e3a1"
TIM_INACTIVE="#585b70"

# Status bar configuration
set -g status on
set -g status-position top
set -g status-interval 1  # Update every second for live time tracking
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g status-left-length 100
set -g status-right-length 100

# Pane borders
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=$ACTIVE_COLOR"

# Messages
set -g message-style "bg=default,fg=$TEXT_COLOR,bold"
set -g message-command-style "bg=default,fg=$TEXT_COLOR,bold"

# Window status format
set -g window-status-format "#[fg=$INACTIVE_COLOR,bg=default] #I:#W "
set -g window-status-current-format "#[fg=$ACTIVE_COLOR,bg=default,bold] #I:#W "
set -g window-status-separator ""

# Enhanced status right with tim integration and dynamic coloring
set -g status-right '#(tim tmux-status 2>/dev/null || echo "⚫ No session") #[fg=grey]#{?client_prefix,#[fg=$ACTIVE_COLOR](■‿■⌐),#[fg=grey](•‿• )}'

# Status left with session info
set -g status-left ' > #[fg=$ACCENT_COLOR,bold]#S #[fg=$INACTIVE_COLOR]'

# ═══════════════════════════════════════════════════════════════
# 🕐 TIM TIME TRACKING INTEGRATION
# ═══════════════════════════════════════════════════════════════

# Tim status refresh interval
set -g @tim-update-interval 1

# Simple status refresh - let the tim command handle all formatting
run-shell 'tmux set-environment -g TIM_AVAILABLE "$(command -v tim >/dev/null 2>&1 && echo "yes" || echo "no")"'

# ═══════════════════════════════════════════════════════════════
# 🪟 WINDOW & PANE MANAGEMENT
# ═══════════════════════════════════════════════════════════════

# Split windows with intuitive keys (maintain current path)
bind-key v split-window -h -c "#{pane_current_path}"  # Vertical split
bind-key h split-window -v -c "#{pane_current_path}"  # Horizontal split

# Kill pane without confirmation
bind-key x kill-pane

# ═══════════════════════════════════════════════════════════════
# ⏰ TIM TIME TRACKING KEYBINDINGS
# ═══════════════════════════════════════════════════════════════

# Quick time tracking controls - Fixed menu actions
bind-key T menu -x P -y P \
    "Start Tracking" s "new-window -n 'Tim-Start' 'tim tmux-quick-start; read -p \"Press Enter to continue...\"'" \
    "Stop Tracking" o "run-shell 'tim stop; tmux display-message \"Stopped tracking\"'" \
    "Show Status" t "new-window -n 'Tim-Status' 'tim; read -p \"Press Enter to continue...\"'" \
    "Show Summary" u "new-window -n 'Tim-Summary' 'tim tmux-summary-popup; read -p \"Press Enter to continue...\"'" \
    "Add New Tag" a "command-prompt -p 'New tag:' 'run-shell \"tim add-tag %%1; tmux display-message \\\"Added tag: %%1\\\"\"'" \
    "View Graph" g "new-window -n 'Tim-Graph' 'tim graph; read -p \"Press Enter to continue...\"'"

# Tim bindings with new windows
bind-key C-s new-window -n 'Tim-Start' 'tim tmux-quick-start; echo "Press Enter to continue..."; read'
bind-key C-o run-shell 'tim stop; tmux display-message "Stopped tracking"'
bind-key C-t new-window -n 'Tim-Status' 'tim; echo "Press Enter to continue..."; read'
bind-key C-u new-window -n 'Tim-Summary' 'tim tmux-summary-popup; echo "Press Enter to continue..."; read'
bind-key C-g new-window -n 'Tim-Graph' 'tim graph; echo "Press Enter to continue..."; read'

# Alternative popup versions (uses safe read)
bind-key M-t display-popup -E -w 80 -h 25 -d '#{pane_current_path}' 'tim; echo; read -n 1 -s -r -p "Press any key to close..."'
bind-key M-p display-popup -E -w 90 -h 30 -d '#{pane_current_path}' 'tim tmux-summary-popup; echo; read -n 1 -s -r -p "Press any key to close..."'
bind-key M-m display-popup -E -w 120 -h 35 -d '#{pane_current_path}' 'tim graph; echo; read -n 1 -s -r -p "Press any key to close..."'

# Tag selection with new window approach
bind-key C-T new-window -n 'Tim-Tags' 'tim tags; echo; echo "Enter tag name to start tracking:"; read tag; if [ -n "$tag" ]; then tim tmux-start-tag "$tag"; fi; echo "Press Enter to continue..."; read'

# ═══════════════════════════════════════════════════════════════
# 🔧 UTILITY KEYBINDINGS
# ═══════════════════════════════════════════════════════════════

# Config management
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"

# Toggle status bar
bind b set -g status

# Quick utilities
bind g run "~/.local/bin/open-github.sh"           # Open GitHub
bind t run "tmux neww ~/.local/bin/time.sh"        # Time tracker (legacy)
bind H run "~/.local/bin/tmux-session-dispensary.sh ~/"  # Session manager

# Application launchers
bind G neww -n "git" -S lazygit                     # Git interface
bind d display-popup -E -w 100 -h 30 "dooit"       # Todo app
bind f popup -w 80% -h 80% -E                       # General popup

# ═══════════════════════════════════════════════════════════════
# 🔍 SESSION SWITCHER (SESH INTEGRATION)
# ═══════════════════════════════════════════════════════════════

bind-key "K" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# ═══════════════════════════════════════════════════════════════
# 🧭 VIM-TMUX NAVIGATOR
# ═══════════════════════════════════════════════════════════════

# Check if current pane is running vim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?"

# Smart pane switching with awareness for vim splits
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Version-aware backslash binding for last pane
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# Cycle through panes
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

# Copy mode vim-tmux navigator bindings
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# ═══════════════════════════════════════════════════════════════
# 🔌 PLUGIN MANAGEMENT
# ═══════════════════════════════════════════════════════════════

# Plugin declarations
set -g @plugin 'tmux-plugins/tpm'           # Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tmux-sensible' # Sensible defaults

# ═══════════════════════════════════════════════════════════════
# 🎯 TIM CUSTOM COMMANDS
# ═══════════════════════════════════════════════════════════════

# Define custom tmux commands for tim integration
bind-key : command-prompt -p "tmux command:" "%%"

# Custom command aliases (can be used with :tim-start, etc.)
set -s command-alias[0] 'tim-start=run-shell "tim tmux-quick-start"'
set -s command-alias[1] 'tim-stop=run-shell "tim stop"'
set -s command-alias[2] 'tim-status=display-popup -E -w 60 -h 20 "tim"'
set -s command-alias[3] 'tim-summary=display-popup -E -w 80 -h 25 "tim tmux-summary-popup"'
set -s command-alias[4] 'tim-graph=display-popup -E -w 100 -h 30 "tim graph"'
set -s command-alias[5] 'tim-tags=display-popup -E -w 40 -h 15 "tim tags"'
set -s command-alias[6] 'tim-add-tag=command-prompt -p "New tag:" "run-shell \"tim add-tag %%\""'

# Hooks to refresh tim status
set-hook -g after-new-session 'run-shell "tmux set-environment -g tim_status \"$(tim tmux-status 2>/dev/null || echo \"⚫ No session\")\"; tmux set-environment -g tim_color \"$(tim tmux-status-color 2>/dev/null || echo \"240\")\""'

# Refresh on window/pane events 
set-hook -g after-new-window 'run-shell "tmux set-environment -g tim_status \"$(tim tmux-status 2>/dev/null || echo \"⚫ No session\")\"; tmux set-environment -g tim_color \"$(tim tmux-status-color 2>/dev/null || echo \"240\")\""'
set-hook -g pane-focus-in 'run-shell "tmux set-environment -g tim_status \"$(tim tmux-status 2>/dev/null || echo \"⚫ No session\")\"; tmux set-environment -g tim_color \"$(tim tmux-status-color 2>/dev/null || echo \"240\")\""'

# Initialize Tmux Plugin Manager (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# ═══════════════════════════════════════════════════════════════
# 📝 CONFIGURATION NOTES
# ═══════════════════════════════════════════════════════════════
# 
# Key Bindings Summary:
# ├── Prefix: C-Space
# ├── Split: v (vertical), h (horizontal)  
# ├── Navigate: C-h/j/k/l (vim-aware)
# ├── Reload: prefix + r
# ├── Status: prefix + b (toggle)
# ├── Session: K (sesh picker)
# ├── Git: G (lazygit)
# ├── Todo: d (dooit)
# ├── Popup: f (general)
# └── Tim Integration:
#     ├── T: Tim menu (start/stop/status/summary/graph) - NEW WINDOWS
#     ├── C-s: Quick start tracking - NEW WINDOW
#     ├── C-o: Quick stop tracking - BACKGROUND
#     ├── C-t: Show tim status - NEW WINDOW
#     ├── C-u: Show tim summary - NEW WINDOW
#     ├── C-g: Show tim graph - NEW WINDOW
#     ├── C-T: Tim tag selection - NEW WINDOW
#     └── Alt versions (popups):
#         ├── M-t: Status popup
#         ├── M-u: Summary popup
#         └── M-g: Graph popup
#
# Tim Commands (use with prefix + :):
# ├── :tim-start    - Start time tracking
# ├── :tim-stop     - Stop time tracking  
# ├── :tim-status   - Show current status
# ├── :tim-summary  - Show session summary
# ├── :tim-graph    - Show activity graph
# ├── :tim-tags     - List all tags
# └── :tim-add-tag  - Add new tag
#
# Dependencies:
# - sesh (session manager)
# - fzf (fuzzy finder)  
# - lazygit (git interface)
# - dooit (todo app)
# - tim (time tracking script)
#
# Note: Main tim commands use new windows for better stability.
# Use Alt+ versions (M-t, M-u, M-g) if you prefer popups.
# ═══════════════════════════════════════════════════════════════
