#=== === === Tmux Settings === === ===#
# Tmux Colors
set -a terminal-features "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
# Tmux Prefix
set -g prefix C-Space
# Tmux Settings
set -g detach-on-destroy off
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on   
set -g mode-keys vi

#=== === === Tmux status line === === ===#
# Define colors
BG_COLOR="#1A1D23"
ACTIVE_COLOR="#b4befe"
INACTIVE_COLOR="#6c7086"
TEXT_COLOR="#cdd6f4"
ACCENT_COLOR="#b4befe"
set -g status on
set -g status-position top
set -g status-interval 3
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g status-left-length 100
set -g status-right-length 100
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=$ACTIVE_COLOR"
set -g message-style "bg=default,fg=$TEXT_COLOR,bold"
set -g message-command-style "bg=default,fg=$TEXT_COLOR,bold"
set -g window-status-format "#[fg=$INACTIVE_COLOR,bg=default] #I:#W "
set -g window-status-current-format "#[fg=$ACTIVE_COLOR,bg=default,bold] #I:#W "
set -g window-status-separator ""
set -g status-right '#(timew | awk "/^ *Total/ {print \$NF}") #{?client_prefix,#[fg=$ACTIVE_COLOR](■‿■⌐),#[fg=grey](•‿• )}'

#=== === === Plugins Initialization === === ===#
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

#=== Rebind splitting windows ===#
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v  -c "#{pane_current_path}"

#=== === === Keybindings === === ===#
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"
bind b set -g status
bind f run "tmux neww ~/.local/bin/tmux-session-dispensary.sh"
bind g run "~/.local/bin/open-github.sh"
bind t run "tmux neww ~/.local/bin/time.sh"
bind L run "~/.local/bin/tmux-session-dispensary.sh ~/code/learning"
bind P run "~/.local/bin/tmux-session-dispensary.sh ~/code/projects"
bind D run "~/.local/bin/tmux-session-dispensary.sh ~/.config"
bind N run "~/.local/bin/tmux-session-dispensary.sh ~/.notes"
bind H run "~/.local/bin/tmux-session-dispensary.sh ~/"
bind S run "~/.local/bin/tmux-session-dispensary.sh ~/code/"
bind G neww -n "git" -S lazygit

#=== === === Vim Tmux Navigator === === ===#

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

#=== === === Tmux plugin manager === === ===#
run '~/.tmux/plugins/tpm/tpm'
